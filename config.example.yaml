# msearch 配置文件
#
# 用法：
#   1. 复制本文件为 config.yaml（该文件已被 .gitignore 忽略，不会进仓库）
#   2. 按需修改下面的项
#   3. msearch serve
#
# 只写想改的项即可，其余沿用默认值（默认值见每项后面的说明）。

# Web 服务监听地址。只监听回环地址时仅本机可访问。
addr: "127.0.0.1:8080"

# ---------------------------------------------------------------- 网络

# 代理地址列表，按顺序回退：前一个连不上就换下一个。
# 留空表示不使用代理。
proxy:
  # - "http://127.0.0.1:7897"

# 代理作用范围：
#   region = 境外引擎优先走代理，境内与通用引擎优先直连（推荐）
#   all    = 所有引擎都优先走代理
proxy_scope: region

# 按引擎单独指定代理，优先级高于上面的全局代理。
# proxy_engines:
#   bt4g: "http://127.0.0.1:7897"

# 单次 HTTP 请求超时。
timeout: 15s

# 单个引擎的墙钟预算：某个引擎太慢时到点就放弃，不拖累整体。
engine_timeout: 15s

# 单次请求的重试次数（网络错误与 5xx 才重试）。
retries: 2

# ---------------------------------------------------------------- 检索默认值
# 这些是界面打开时的初始值，界面上仍可临时调整。

# 默认参与的引擎，留空表示全部。
# engines: ["apibay", "bt4g", "knaben"]

# 每页默认条数。
limit: 20

# 每个引擎默认取回多少条。
per_engine_limit: 50

# 拆词检索：把查询拆成"完整查询 + 各个独立关键词"分别交给引擎检索，
# 合并去重后，命中关键词更多的结果排名更靠前；只命中部分关键词的结果也会保留，
# 但数字/版本号等锚点仍然必须匹配。关闭后只按完整查询检索。
split_query: true

# 拆词检索最多使用几个独立关键词（0 表示使用默认值 4）。
max_query_terms: 4

# 死链处理策略：
#   hide   = 隐藏被判死的（默认）
#   mark   = 显示但打上死链标签
#   strict = 只认正面死亡证据（探测明确返回 0）
#   off    = 完全不过滤
dead_filter: hide

# 可信对等端少于该值的资源直接丢弃，0 表示不限制。
min_peers: 0

# 置信度低于该值的结果丢弃，取值范围 0~1，0 表示不限制。
min_confidence: 0

# 顶部为"冷门但确实活着"的资源预留的席位数：
#   -1 = 自动（输出条数的 20%）  0 = 关闭
rare_quota: -1

# 判定为"稀有"的对等端上界。
rare_max_peers: 4

# 同一资源簇最多输出几条（0 = 不限制）。防止同一作品的多个版本刷屏。
per_cluster: 2

# 聚类粒度：
#   resolution = 按画质档位区分（推荐，1080p 与 720p 算不同簇）
#   full       = 再区分来源与编码
#   none       = 不聚类
cluster_key: resolution

# 是否启用 tracker/DHT 存活探测。
# 探测通道不通时会自动跳过，只用引擎元数据判定。
probe: true

# 分类过滤，由各引擎自行解释，留空表示不过滤。
category: ""

# ---------------------------------------------------------------- 数据库
# 关闭时：不记录检索、不需要登录。
# 开启时：记录每次检索（关键词、时间、来源 IP、引擎、结果条数、耗时），
#         并按下面的开关决定是否要求登录、是否开放注册。

database:
  enabled: false
  # MySQL 连接信息。密码含 @ : / 等字符时按普通字符串写即可，无需转义。
  host: "127.0.0.1"
  port: 3306
  username: root
  password: "yourpassword"
  database: msearch
  # 旧版兼容项：完整的 MySQL 连接串。填写后优先于上面的拆分字段；
  # 新配置建议使用拆分字段，仅在迁移旧配置时保留 dsn。
  # dsn: "root:yourpassword@tcp(127.0.0.1:3306)/msearch?parseTime=true&charset=utf8mb4&loc=Local"
  # 存在账号时，是否要求登录后才能检索（默认 true）。
  require_login: true
  # 是否允许自助注册账号（默认 false）。
  allow_register: false

# 登录账号。用户名与密码都填时，启动会创建或更新账号；
# 之后可以都留空（账号已存在库里）。
# 首次启用数据库时填一次即可。
account:
  username: ""
  password: ""

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磁力聚合搜索</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8cff'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel-2: #1d212a;
  --border: #2a2f3a;
  --text: #e6e9ef;
  --muted: #8b93a3;
  --accent: #5b8cff;
  --accent-dim: #2a3d6b;
  --alive: #3fb950;
  --cold: #d29922;
  --dead: #f85149;
  --unknown: #6e7681;
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --border: #dfe3e8;
    --text: #1a1d23; --muted: #6b7280; --accent: #2563eb; --accent-dim: #c7d7fe;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column;
}
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

/* 顶栏 */
header {
  display: flex; align-items: center; gap: 16px;
  padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: .2px; white-space: nowrap; }
.brand .logo {
  width: 22px; height: 22px; border-radius: 6px;
  background: linear-gradient(135deg, var(--accent), #a855f7);
  display: grid; place-items: center; font-size: 12px; color: #fff;
}
.health { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.health .dots { display: flex; gap: 4px; }
.health .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--unknown); }
.health .dot.pending { background: var(--muted); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
.health .dot.bad { background: var(--dead); }
.health .dot.ok { background: var(--alive); }
.health .dot.bad { background: var(--dead); }
.health button { color: var(--muted); text-decoration: underline dotted; }
.health button:hover { color: var(--text); }
#accountChip { display: inline-flex; align-items: center; gap: 10px; }

/* 搜索区 */
.searchwrap { padding: 18px 20px 0; }
.searchbar { display: flex; gap: 10px; }
.searchbar input {
  flex: 1; min-width: 0; padding: 12px 14px; font-size: 15px;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius); outline: none;
}
.searchbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.searchbar button {
  padding: 0 22px; background: var(--accent); color: #fff; font-weight: 600;
  border-radius: var(--radius); white-space: nowrap;
}
.searchbar button:hover { filter: brightness(1.08); }
.searchbar button:disabled { opacity: .6; cursor: progress; }

/* 筛选栏 */
.filters {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 12px 2px; font-size: 13px; color: var(--muted);
}
.filters .grp { display: flex; align-items: center; gap: 6px; }
/* 自绘提示：固定定位，脚本按视口边缘收敛位置，手机上也能点开 */
.tip { cursor: help; }
.tip .q {
  display: inline-block; width: 14px; height: 14px; line-height: 13px; text-align: center;
  border-radius: 50%; border: 1px solid var(--border); color: var(--muted);
  font-size: 10px; font-weight: 600; margin-left: 5px; vertical-align: 1px; user-select: none;
}
.tip:hover .q, .tip:focus .q { color: var(--accent); border-color: var(--accent); }
.tip-bubble {
  position: fixed; z-index: 70; width: max-content;
  max-width: min(320px, calc(100vw - 24px)); max-height: min(70vh, 480px);
  overflow-y: auto; overscroll-behavior: contain;
  padding: 10px 12px; border-radius: 9px;
  background: var(--panel); border: 1px solid var(--accent); color: var(--text);
  font-size: 12px; line-height: 1.65; font-weight: 400; text-align: left;
  white-space: pre-line; box-shadow: 0 10px 28px rgba(0,0,0,.4);
  pointer-events: none; visibility: hidden;
}
.tip-bubble.open { visibility: visible; }
.tip-bubble[hidden] { display: none; }
.filters label { white-space: nowrap; }
.filters select, .filters input[type=number] {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 7px; padding: 4px 7px; font: inherit; font-size: 12.5px; outline: none;
}
.filters input[type=number] { width: 62px; }
.filters input[type=text] { background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 7px; padding: 4px 8px; font: inherit; font-size: 12.5px; outline: none; min-width: 200px; }
.filters input[type=text]:focus { border-color: var(--accent); }
.filters .mini { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; }
.filters .mini:hover { color: var(--text); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--panel); font-size: 12.5px; color: var(--muted); cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
.chip.on { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
.chip .rdot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.chip.on .rdot { background: var(--accent); }
.chip.overseas .rdot { background: var(--cold); }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); }

/* 结果区 */
main { flex: 1; padding: 4px 20px 28px; scroll-margin-top: 64px; }
.status { color: var(--muted); font-size: 12.5px; padding: 6px 2px 10px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.status .warn { color: var(--cold); }
.paging-hint { display: inline-flex; align-items: center; gap: 6px; }
.results { display: flex; flex-direction: column; gap: 8px; }
.results .card { order: 0; }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start;
}
.card:hover { border-color: #39404e; }
.rank { color: var(--muted); font: 600 13px var(--mono); text-align: right; padding-top: 2px; }
.main { min-width: 0; }
.title { font-weight: 550; word-break: break-word; }
.meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.meta b { color: var(--text); font-weight: 550; }
.src { border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; font-size: 11.5px; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.badge {
  font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
  border: 1px solid transparent; white-space: nowrap;
}
.badge.alive { color: var(--alive); background: rgba(63,185,80,.12); border-color: rgba(63,185,80,.35); }
.badge.cold { color: var(--cold); background: rgba(210,153,34,.12); border-color: rgba(210,153,34,.35); }
.badge.dead { color: var(--dead); background: rgba(248,81,73,.12); border-color: rgba(248,81,73,.35); }
.badge.unknown { color: var(--unknown); background: rgba(110,118,129,.12); border-color: rgba(110,118,129,.35); }
.bar { width: 180px; height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .b-rel { background: var(--accent); }
.bar .b-life { background: var(--alive); }
.bar .b-swarm { background: var(--cold); }
.bar .b-fresh { background: #a855f7; }
.rowbtns { display: flex; gap: 6px; }
.mini {
  font-size: 12px; color: var(--muted); border: 1px solid var(--border);
  border-radius: 6px; padding: 2px 8px;
}
.mini:hover { color: var(--text); border-color: var(--accent); }
.rarestar { color: var(--cold); font-size: 12px; }

.pager { display: flex; align-items: center; gap: 6px; justify-content: center; padding: 20px 0 10px; flex-wrap: wrap; }
.pager button {
  min-width: 32px; height: 30px; padding: 0 10px; font-size: 13px;
  border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--muted);
}
.pager button:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
.pager button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.pager button:disabled { opacity: .35; cursor: default; }
.pager.loading { opacity: .55; }
.pager.loading button { pointer-events: none; }
.pager .info { color: var(--muted); font-size: 12.5px; margin-left: 12px; }

.empty { color: var(--muted); text-align: center; padding: 60px 0; }
.empty .big { font-size: 15px; margin-bottom: 6px; color: var(--text); }
.spinner {
  width: 15px; height: 15px; border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; display: inline-block; vertical-align: -2px; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 详情抽屉 */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%);
  background: var(--panel); border-left: 1px solid var(--border);
  transform: translateX(100%); transition: transform .18s ease; z-index: 40;
  overflow-y: auto; padding: 18px 20px 40px;
}
.drawer.open { transform: none; }
.drawer h3 { margin: 0 0 4px; font-size: 15px; }
.drawer .kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: 12.5px; margin-top: 14px; }
.drawer .kv dt { color: var(--muted); }
.drawer .kv dd { margin: 0; word-break: break-all; font-family: var(--mono); font-size: 12px; }
.parts { margin-top: 16px; }
.parts .row { display: grid; grid-template-columns: 72px 1fr 48px; gap: 8px; align-items: center; font-size: 12.5px; margin-bottom: 5px; }
.parts .track { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.parts .track i { display: block; height: 100%; }
.parts .val { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.copyrow { display: flex; gap: 8px; margin-top: 16px; }
.copyrow input {
  flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--border);
  color: var(--text); border-radius: 7px; padding: 8px 10px; font: 12px var(--mono);
}
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 35; display: none; }
.mask.open { display: block; }
.hint { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.7; }
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--accent); color: var(--text);
  padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none;
  transition: opacity .2s; z-index: 60;
}
.toast.show { opacity: 1; }

/* 详情抽屉的关闭按钮 */
.drawer-head {
  display: flex; align-items: flex-start; gap: 10px;
  position: sticky; top: -18px; z-index: 2;
  background: var(--panel); padding: 4px 0 10px; margin-bottom: 2px;
}
.drawer-head h3 { flex: 1; margin: 0; }
.drawer-close {
  font-size: 17px; line-height: 1; padding: 5px 9px; border-radius: 8px;
  color: var(--muted); border: 1px solid var(--border);
}
.drawer-close:hover { color: var(--text); border-color: var(--accent); }

/* 折叠按钮默认只在手机端出现 */
.filters-toggle { display: none; }

/* 登录遮罩 */
.gate {
  position: fixed; inset: 0; z-index: 80; display: none;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(8, 10, 14, .72); backdrop-filter: blur(3px);
}
.gate.open { display: flex; }
.gate-card {
  width: min(360px, 100%); background: var(--panel); border: 1px solid var(--border);
  border-radius: 14px; padding: 22px 20px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.gate-title { font-size: 17px; font-weight: 650; margin-bottom: 6px; }
.gate-sub { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin-bottom: 16px; }
.gate-field { display: block; margin-bottom: 12px; }
.gate-field span { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 5px; }
.gate-field input {
  width: 100%; padding: 10px 12px; font-size: 15px; color: var(--text);
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; outline: none;
}
.gate-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.gate-submit {
  width: 100%; padding: 11px; margin-top: 4px; border-radius: 9px;
  background: var(--accent); color: #fff; font-weight: 600; font-size: 14.5px;
}
.gate-submit:disabled { opacity: .6; cursor: progress; }
.gate-err { color: var(--dead); font-size: 12.5px; min-height: 18px; margin-top: 8px; }
.gate-foot { margin-top: 6px; font-size: 12.5px; text-align: center; }

/* 搜索历史 */
.historybar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
  padding: 10px 2px 0; font-size: 12.5px; color: var(--muted);
}
.historybar .hlabel { white-space: nowrap; }
.history-chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.history-chip {
  max-width: min(340px, 62vw); padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.history-chip:hover { border-color: var(--accent); }
.history-chip.pressing { border-color: var(--cold); color: var(--cold); }
.historybar .clear { white-space: nowrap; }

/* 收藏 */
.star.on { color: var(--cold); border-color: rgba(210,153,34,.55); }
.fav-filter {
  width: 100%; margin: 4px 0 12px; padding: 8px 10px; font: inherit; font-size: 13px;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; outline: none;
}
.fav-filter:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.fav-row {
  border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px;
  margin-bottom: 9px; background: var(--panel-2);
}
.fav-row .ftitle { font-weight: 550; word-break: break-word; }
.fav-row .fmeta { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 3px 10px; }
.fav-row .fmeta b { color: var(--text); font-weight: 550; }
.fav-row .fnote { color: var(--cold); font-size: 12px; margin-top: 5px; word-break: break-word; }
.fav-row .fbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fav-edit { display: flex; flex-direction: column; gap: 7px; }
.fav-edit input {
  width: 100%; padding: 7px 9px; font: inherit; font-size: 13px;
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 7px; outline: none;
}
.fav-edit input:focus { border-color: var(--accent); }

/* 文件列表 */
.files { margin-top: 18px; }
.files h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.files .ftotal { color: var(--muted); font-size: 12px; font-weight: 400; }
.files ul {
  list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow-y: auto;
  border: 1px solid var(--border); border-radius: 8px;
}
.files li {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 6px 9px; font-size: 12px; border-bottom: 1px solid var(--border);
}
.files li:last-child { border-bottom: none; }
.files li .fp { min-width: 0; word-break: break-all; font-family: var(--mono); font-size: 11.5px; }
.files li .fs { color: var(--muted); white-space: nowrap; }

/* ============ 手机端 ============ */
@media (max-width: 640px) {
  /* 筛选项在手机上占好几行，先折叠起来，把首屏留给结果 */
  .filters-toggle {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    margin-top: 8px; padding: 9px 13px; font-size: 13px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
  }
  .filters { display: none; padding: 10px 2px 4px; }
  .filters.open { display: flex; }
  .drawer-close { min-width: 40px; min-height: 40px; font-size: 18px; }
  header { padding: 10px 12px; gap: 10px; }
  .brand { font-size: 14px; }
  .brand .logo { width: 18px; height: 18px; font-size: 10px; }
  .health { font-size: 11px; gap: 6px; }
  .health .dots { gap: 3px; }
  .health .dot { width: 7px; height: 7px; }

  .searchwrap { padding: 12px 12px 0; }
  .searchbar { gap: 8px; }
  /* 16px 可避免 iOS 聚焦时自动放大页面 */
  .searchbar input { padding: 11px 12px; font-size: 16px; }
  .searchbar button { padding: 0 15px; font-size: 14px; }

  main { padding: 0 12px 22px; }
  .filters { gap: 7px 10px; padding: 10px 0; font-size: 12px; }
  .filters .grp { gap: 5px; flex-wrap: wrap; }
  .filters input[type=text] { width: 100%; min-width: 0; }
  .filters select, .filters input[type=number] { font-size: 12px; }
  .tip-bubble { max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); font-size: 12.5px; }
  .status { font-size: 11.5px; gap: 6px 10px; padding: 4px 0 10px; }

  .historybar { font-size: 11.5px; padding-top: 8px; }
  .history-chip { max-width: 100%; font-size: 12px; }
  .fav-row .fbtns .mini { padding: 6px 12px; font-size: 12.5px; }
  .files ul { max-height: 45vh; }
  .files li { font-size: 11.5px; }

  /* 结果卡片：状态与按钮折到下一行，标题占满宽度 */
  .card { grid-template-columns: 22px 1fr; gap: 6px 9px; padding: 11px 12px; }
  .rank { font-size: 12px; padding-top: 2px; }
  .title { font-size: 14px; line-height: 1.45; }
  .meta { font-size: 11.5px; gap: 2px 9px; margin-top: 3px; }
  .side {
    grid-column: 2; flex-direction: row; flex-wrap: wrap;
    align-items: center; justify-content: flex-start; gap: 8px;
  }
  .side .bar { order: 3; width: 100%; height: 4px; }
  .badge { font-size: 11px; padding: 1px 8px; }
  .rowbtns { gap: 8px; }
  .rowbtns .mini { padding: 6px 13px; font-size: 12.5px; }

  .pager { gap: 5px; padding: 14px 0 4px; }
  .pager button { min-width: 34px; height: 34px; padding: 0 8px; font-size: 12.5px; }
  .pager .info { width: 100%; text-align: center; margin: 8px 0 0; }

  /* 抽屉铺满整屏时，靠右上角的关闭按钮退出（原来只能靠点遮罩，手机上点不到） */
  .drawer { width: 100%; padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }
  .drawer-head { top: -14px; }
  .drawer .kv { grid-template-columns: 78px 1fr; }
  .copyrow { flex-direction: column; }
  .copyrow .mini { width: 100%; padding: 9px; }
  .parts .row { grid-template-columns: 62px 1fr 42px; }

  .gate-card { padding: 20px 16px 16px; }
}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="logo">⬢</span>磁力聚合搜索</div>
  <div class="health">
    <span class="dots" id="healthDots"></span>
    <span id="healthText">引擎状态未知</span>
    <button id="healthBtn" type="button">检测</button>
    <button id="favBtn" type="button" title="收藏管理" style="display:none">收藏</button>
    <span id="accountChip" style="display:none">
      <button id="loginBtn" type="button" title="登录">登录</button>
      <button id="accountBtn" type="button" title="账号设置">账号</button>
      <button id="logoutBtn" type="button" title="退出登录">退出</button>
    </span>
  </div>
</header>

<div class="searchwrap">
  <div class="searchbar">
    <input id="q" type="search" placeholder="输入关键词，例如：ubuntu 24.04、葬送のフリーレン、Matrix" autocomplete="off" spellcheck="false">
    <button id="go" type="button">搜索</button>
  </div>
  <div class="historybar" id="historyBar" style="display:none">
    <span class="hlabel">最近搜索</span>

<script>
const $ = (id) => document.getElementById(id);
let engines = [];
let activeEngines = new Set();
let lastData = null;
let stream = null;
let searchState = null;
let searchSeq = 0;
let liveResults = [];
let engineProgress = {};
let authState = {
  db_enabled: false,
  db_available: false,
  needs_setup: false,
  logged_in: false,
  require_login: false,
  allow_register: false,
};
let gateMode = "login";
let historyItems = [];
let favorites = [];
let favoriteHashes = new Set();
let currentDetail = null;
let editingFavId = 0;
const fileCache = new Map();

const VERDICT = {
  alive:   { cls: "alive",   text: "活跃" },
  cold:    { cls: "cold",    text: "冷门" },
  dead:    { cls: "dead",    text: "死链" },
  unknown: { cls: "unknown", text: "未知" },
};
const PART_COLOR = { relevance: "var(--accent)", life: "var(--alive)", swarm: "var(--cold)", freshness: "#a855f7" };
const PART_NAME  = { relevance: "相关度", life: "存活证据", swarm: "群体规模", freshness: "新鲜度" };

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1600);
}

function fmtSize(bytes) {
  if (!bytes || bytes < 0) return "-";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + " " + units[i];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => toast("磁力链接已复制")).catch(() => toast("复制失败"));
}

// attachLongPress 给元素加长按手势：按住 650ms 触发，触发后吞掉随后的 click。
function attachLongPress(el, onLongPress) {
  let timer = null;
  let fired = false;
  const clear = () => {
    if (timer) { clearTimeout(timer); timer = null; }
    el.classList.remove("pressing");
  };
  el.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    fired = false;
    el.classList.add("pressing");
    timer = setTimeout(() => {
      fired = true;
      el.classList.remove("pressing");
      onLongPress();
    }, 650);
  });
  el.addEventListener("pointerup", clear);
  el.addEventListener("pointerleave", clear);
  el.addEventListener("pointercancel", clear);
  el.addEventListener("contextmenu", (e) => e.preventDefault());
  el.addEventListener("click", (e) => {
    if (!fired) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    fired = false;
  });
}

/* ---------- 搜索历史（关联账号，数据库未启用时隐藏） ---------- */
async function refreshUserData() {
  await loadHistory();
  await loadFavorites();
}

async function loadHistory() {
  if (!authState.db_enabled) {
    historyItems = [];
    renderHistory();
    return;
  }
  try {
    const data = await (await fetch("/api/history")).json();
    historyItems = Array.isArray(data.items) ? data.items : [];
  } catch (e) {
    historyItems = [];
  }
  renderHistory();
}

function renderHistory() {
  const bar = $("historyBar");
  const box = $("historyChips");
  box.innerHTML = "";
  const seen = new Set();
  const items = historyItems.filter((it) => {
    const key = String(it.query || "").trim().toLowerCase();
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  if (!authState.db_enabled || !items.length) {
    bar.style.display = "none";
    return;
  }
  // 最多展示最近 12 条，避免历史把首屏结果挤下去。
  items.slice(0, 12).forEach((it) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "history-chip";
    chip.textContent = it.query;
    chip.title = "点击填入关键词；长按删除";
    attachLongPress(chip, () => deleteHistory(it.query));
    chip.addEventListener("click", () => {
      $("q").value = it.query;
      $("q").focus();
      toast("已填入关键词");
    });
    box.appendChild(chip);
  });
  bar.style.display = "";
}

async function deleteHistory(query) {
  try {
    const resp = await fetch("/api/history?query=" + encodeURIComponent(query), { method: "DELETE" });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error || "删除失败");
    historyItems = historyItems.filter((it) => it.query !== query);
    renderHistory();
    toast("已删除该历史");
  } catch (e) {
    toast(e.message || "删除失败");
  }
}

async function clearHistory() {
  if (!historyItems.length) return;
  if (!confirm("确定清空全部搜索历史？")) return;
  try {
    const resp = await fetch("/api/history/clear", { method: "POST" });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error || "清空失败");
    historyItems = [];
    renderHistory();
    toast("已清空搜索历史");
  } catch (e) {
    toast(e.message || "清空失败");
  }
}

/* ---------- 收藏 ---------- */
async function loadFavorites() {
  if (!authState.db_enabled) {
    favorites = [];
    favoriteHashes = new Set();
    updateStarButtons();
    renderFavorites();
    return;
  }
  try {
    const data = await (await fetch("/api/favorites")).json();
    favorites = Array.isArray(data.items) ? data.items : [];
  } catch (e) {
    favorites = [];
  }
  favoriteHashes = new Set(favorites.map((f) => f.info_hash));
  updateStarButtons();
  renderFavorites();
}

// updateStarButtons 同步所有已渲染卡片的星标状态。
function updateStarButtons() {
  document.querySelectorAll("[data-fav-hash]").forEach((btn) => {
    const on = favoriteHashes.has(btn.dataset.favHash);
    btn.textContent = on ? "★ 已收藏" : "☆ 收藏";
    btn.classList.toggle("on", on);
  });
  if (currentDetail) {
    const on = favoriteHashes.has(currentDetail.info_hash);
    $("dFav").textContent = on ? "★ 已收藏" : "☆ 收藏";
    $("dFav").classList.toggle("on", on);
  }
}

async function toggleFavorite(r) {
  if (!authState.db_enabled) {
    toast("收藏需要启用数据库");
    return;
  }
  const on = favoriteHashes.has(r.info_hash);
  try {
    let resp;
    if (on) {
      resp = await fetch("/api/favorites?hash=" + encodeURIComponent(r.info_hash), { method: "DELETE" });
    } else {
      resp = await fetch("/api/favorites", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          info_hash: r.info_hash,
          title: r.title,
          magnet: r.magnet,
          size: r.size,
          size_bytes: r.size_bytes,
          seeders: r.seeders,
          leechers: r.leechers,
          sources: r.sources || [],
        }),
      });
    }
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error || "操作失败");
    await loadFavorites();
    toast(on ? "已取消收藏" : "已加入收藏");
  } catch (e) {
    toast(e.message || "收藏失败");
  }
}

async function openFavDrawer() {
  if (!authState.db_enabled) {
    toast("收藏需要启用数据库");
    return;
  }
  closeDetail();
  $("favFilter").value = "";
  await loadFavorites();
  $("favDrawer").classList.add("open");
  syncMask();
  $("favFilter").focus();
}

function closeFavDrawer() {
  $("favDrawer").classList.remove("open");
  syncMask();
}

function renderFavorites() {
  const box = $("favList");
  if (!box) return;
  const filter = ($("favFilter").value || "").trim().toLowerCase();
  const list = favorites.filter((f) => {
    if (!filter) return true;
    return (String(f.title || "") + " " + String(f.note || "")).toLowerCase().includes(filter);
  });
  box.innerHTML = "";
  if (!list.length) {
    const msg = favorites.length ? "没有匹配的收藏" : "还没有收藏";
    box.innerHTML = `<div class="empty" style="padding:34px 0"><div class="big">${msg}</div><div>在搜索结果里点 ☆ 即可加入收藏</div></div>`;
    return;
  }
  list.forEach((f) => box.appendChild(buildFavRow(f)));
}

function buildFavRow(f) {
  if (editingFavId === f.id) return buildFavEditRow(f);
  const row = document.createElement("div");
  row.className = "fav-row";
  row.innerHTML = `
    <div class="ftitle"></div>
    <div class="fmeta">
      ${f.size ? `<span>大小 <b>${escapeHtml(f.size)}</b></span>` : ""}
      ${f.seeders >= 0 ? `<span>做种 <b>${f.seeders}</b></span>` : ""}
      ${(f.sources || []).length ? `<span>${escapeHtml((f.sources || []).join(" · "))}</span>` : ""}
    </div>
    ${f.note ? `<div class="fnote"></div>` : ""}
    <div class="fbtns">
      <button class="mini" data-act="copy" type="button">复制磁力</button>
      <button class="mini" data-act="search" type="button">按标题搜索</button>
      <button class="mini" data-act="edit" type="button">编辑</button>
      <button class="mini" data-act="del" type="button">删除</button>
    </div>`;
  row.querySelector(".ftitle").textContent = f.title;
  if (f.note) row.querySelector(".fnote").textContent = "备注：" + f.note;
  row.querySelector('[data-act="copy"]').onclick = () => copyToClipboard(f.magnet);
  row.querySelector('[data-act="search"]').onclick = () => {
    $("q").value = f.title;
    closeFavDrawer();
    search(1);
  };
  row.querySelector('[data-act="edit"]').onclick = () => {
    editingFavId = f.id;
    renderFavorites();
  };
  row.querySelector('[data-act="del"]').onclick = () => deleteFavorite(f);
  return row;
}

function buildFavEditRow(f) {
  const row = document.createElement("div");
  row.className = "fav-row";
  row.innerHTML = `
    <div class="fav-edit">
      <input class="edit-title" type="text" placeholder="标题">
      <input class="edit-note" type="text" placeholder="备注（可选）">
      <div class="fbtns">
        <button class="mini" data-act="save" type="button">保存</button>
        <button class="mini" data-act="cancel" type="button">取消</button>
      </div>
    </div>`;
  const titleInput = row.querySelector(".edit-title");
  const noteInput = row.querySelector(".edit-note");
  titleInput.value = f.title;
  noteInput.value = f.note || "";
  row.querySelector('[data-act="cancel"]').onclick = () => {
    editingFavId = 0;
    renderFavorites();
  };
  row.querySelector('[data-act="save"]').onclick = async () => {
    const title = titleInput.value.trim();
    if (!title) { toast("标题不能为空"); titleInput.focus(); return; }
    try {
      const resp = await fetch("/api/favorites/" + f.id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, note: noteInput.value.trim() }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || "保存失败");
      editingFavId = 0;
      await loadFavorites();
      toast("收藏已更新");
    } catch (e) {
      toast(e.message || "保存失败");
    }
  };
  setTimeout(() => titleInput.focus(), 30);
  return row;
}

async function deleteFavorite(f) {
  if (!confirm(`删除收藏「${f.title}」？`)) return;
  try {
    const resp = await fetch("/api/favorites/" + f.id, { method: "DELETE" });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error || "删除失败");
    await loadFavorites();
    toast("收藏已删除");
  } catch (e) {
    toast(e.message || "删除失败");
  }
}

/* ---------- 磁力内容（文件列表） ---------- */
async function loadFiles(hash) {
  const box = $("dFiles");
  if (!box) return;
  if (!hash) { box.innerHTML = ""; return; }
  if (fileCache.has(hash)) {
    renderFiles(hash, fileCache.get(hash));
    return;
  }
  box.innerHTML = `<h4>文件列表</h4><div class="ftotal"><span class="spinner"></span> 正在读取磁力内容…</div>`;
  try {
    const resp = await fetch("/api/files?hash=" + encodeURIComponent(hash));
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error || "暂无文件数据");
    fileCache.set(hash, data);
    renderFiles(hash, data);
  } catch (e) {
    if (currentDetail && currentDetail.info_hash === hash) {
      box.innerHTML = `<h4>文件列表</h4><div class="ftotal">暂无文件数据（${escapeHtml(e.message || "公共缓存未收录")}）</div>`;
    }
  }
}

function renderFiles(hash, meta) {
  const box = $("dFiles");
  if (!box || !currentDetail || currentDetail.info_hash !== hash) return;
  const files = meta.files || [];
  const total = meta.total_bytes ? fmtSize(meta.total_bytes) : "-";
  let html = `<h4>文件列表 <span class="ftotal">共 ${meta.file_count || files.length} 个 · ${total}</span></h4>`;
  if (!files.length) {
    box.innerHTML = html + `<div class="ftotal">种子里没有文件信息</div>`;
    return;
  }
  html += `<ul>${files.map((f) => `<li><span class="fp">${escapeHtml(f.path)}</span><span class="fs">${fmtSize(f.size_bytes)}</span></li>`).join("")}</ul>`;
  if (meta.truncated) html += `<div class="ftotal">文件过多，仅显示前 ${files.length} 个</div>`;
  box.innerHTML = html;
}

/* ---------- 偏好设置：引擎选择与每页条数记在浏览器本地 ---------- */
function loadPrefs() {
  try {
    const raw = localStorage.getItem("msearch.prefs");
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function savePrefs() {
  try {
    localStorage.setItem("msearch.prefs", JSON.stringify({
      engines: [...activeEngines],
      perPage: $("perPage").value,
    }));
  } catch (e) { /* 忽略存储失败 */ }
}

/* ---------- 引擎清单 ---------- */
async function loadEngines() {
  try {
    engines = await (await fetch("/api/engines")).json();
  } catch (e) {
    engines = [];
  }
  const prefs = loadPrefs();
  if (prefs && Array.isArray(prefs.engines)) {
    const known = new Set(engines.map((e) => e.name));
    activeEngines = new Set(prefs.engines.filter((n) => known.has(n)));
  } else {
    activeEngines = new Set(engines.map((e) => e.name));
  }
  if (prefs && prefs.perPage) $("perPage").value = prefs.perPage;
  renderEngineChips();
  updateFiltersSummary();
}

// renderEngineChips 渲染引擎开关，第一项是"全部"快捷开关。
function renderEngineChips() {
  const box = $("engineChips");
  box.innerHTML = "";

  const all = document.createElement("button");
  all.type = "button";
  all.className = "chip" + (activeEngines.size === engines.length && engines.length ? " on" : "");
  all.textContent = "全部";
  all.title = "全选或全不选";
  all.onclick = () => {
    if (activeEngines.size === engines.length) activeEngines.clear();
    else activeEngines = new Set(engines.map((e) => e.name));
    renderEngineChips();
    savePrefs();
    updateFiltersSummary();
  };
  box.appendChild(all);

  engines.forEach((e) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip" + (activeEngines.has(e.name) ? " on" : "") + (e.region === "overseas" ? " overseas" : "");
    chip.innerHTML = `<span class="rdot"></span>${e.name}`;
    chip.title = `${e.description}（${e.region === "overseas" ? "境外，优先走代理" : "通用"}）`;
    chip.onclick = () => {
      if (activeEngines.has(e.name)) activeEngines.delete(e.name);
      else activeEngines.add(e.name);
      renderEngineChips();
      savePrefs();
      updateFiltersSummary();
    };
    box.appendChild(chip);
  });
}

/* ---------- 引擎可达性自检：流式，谁先回来先显示 ---------- */
async function checkHealth() {
  const dots = $("healthDots");
  $("healthText").textContent = "检测中…";
  dots.innerHTML = "";

  const params = new URLSearchParams();
  if (activeEngines.size) params.set("engines", [...activeEngines].join(","));

  const es = new EventSource("/api/check/stream?" + params.toString());
  const seen = new Map();
  es.addEventListener("engine", (e) => {
    const d = JSON.parse(e.data);
    seen.set(d.name, d);
    drawDots(seen);
    const okCount = [...seen.values()].filter((x) => x.ok).length;
    $("healthText").textContent = `${okCount}/${seen.size} 个引擎可用`;
  });
  es.addEventListener("done", (e) => {
    const d = JSON.parse(e.data);
    $("healthText").textContent = `${d.ok}/${d.total} 个引擎可用`;
    es.close();
  });
  es.addEventListener("error", () => {
    $("healthText").textContent = "检测失败";
    es.close();
  });
}

// drawDots 按引擎名固定顺序画状态点。
function drawDots(seen) {
  const dots = $("healthDots");
  dots.innerHTML = "";
  engines.forEach((e) => {
    const d = seen.get(e.name);
    const dot = document.createElement("span");
    dot.className = "dot" + (d ? (d.ok ? " ok" : " bad") : " pending");
    dot.title = d
      ? `${e.name}：${d.ok ? "可用，" + d.count + " 条" : "不可用 —— " + (d.error || "")}`
      : `${e.name}：检测中…`;
    dots.appendChild(dot);
  });
}

/* ---------- 检索参数 ---------- */
// snapshotParams 保存一次检索的筛选条件；翻页必须沿用它，
// 否则用户改了输入框或筛选条后点页码，会拿新条件去翻旧结果。
function snapshotParams(q) {
  return new URLSearchParams({
    q,
    per_page: $("perPage").value || "20",
    engines: [...activeEngines].join(","),
    dead_filter: $("deadFilter").value,
    min_peers: $("minPeers").value || "0",
    rare_quota: $("rareQuota").value,
    per_cluster: $("perCluster").value || "0",
    probe: $("probe").checked ? "1" : "0",
  });
}

// pageParams 在参数快照上只替换页码。
function pageParams(page) {
  const params = new URLSearchParams(searchState.params);
  params.set("page", String(page));
  return params;
}

function setPagerLoading(on) {
  const box = $("pager");
  box.classList.toggle("loading", on);
  box.setAttribute("aria-busy", on ? "true" : "false");
}

function addPageHint(page) {
  const hint = document.createElement("span");
  hint.className = "paging-hint";
  hint.innerHTML = `<span class="spinner"></span> 正在载入第 ${page} 页…`;
  $("status").appendChild(hint);
}

/* ---------- 搜索 ---------- */
async function search(page = 1, useSnapshot = false) {
  if (page === 1 && !useSnapshot) {
    const q = $("q").value.trim();
    if (!q) return;
    searchState = { query: q, params: snapshotParams(q) };
  } else if (!searchState) {
    return;
  }
  const seq = ++searchSeq;
  closeStream();
  $("go").disabled = true;

  try {
    if (page === 1 && !useSnapshot) {
      setPagerLoading(false);
      $("status").innerHTML = `<span><span class="spinner"></span> 搜索中…</span>`;
      $("pager").innerHTML = "";
      await streamSearch(seq);
    } else {
      // 保留上一页内容和页码，只置灰并加提示，避免整屏像重新加载
      setPagerLoading(true);
      addPageHint(page);
      const ok = await fetchPage(page, seq);
      setPagerLoading(false);
      if (ok && seq === searchSeq) {
        document.querySelector("main").scrollIntoView({ block: "start" });
      }
    }
  } finally {
    if (seq === searchSeq) $("go").disabled = false;
  }
}

// streamSearch 用 SSE 边搜边出：引擎一完成就报进度，结果一条条上屏。
function streamSearch(seq) {
  return new Promise((resolve) => {
    const es = new EventSource("/api/search/stream?" + pageParams(1).toString());
    stream = es;
    resetLive();
    engineProgress = {};

    es.addEventListener("engine", (e) => {
      if (seq !== searchSeq) return;
      const d = JSON.parse(e.data);
      engineProgress[d.engine] = d;
      renderProgress();
    });
    es.addEventListener("result", (e) => {
      if (seq !== searchSeq) return;
      pushLive(JSON.parse(e.data));
    });
    es.addEventListener("done", (e) => {
      const d = JSON.parse(e.data);
      es.close();
      if (stream === es) stream = null;
      if (seq !== searchSeq) { resolve(); return; }
      lastData = d;
      renderStatus(d);
      renderResults(d.results || []);
      renderPager(d);
      loadHistory();
      resolve();
    });
    es.addEventListener("error", async () => {
      es.close();
      if (stream === es) stream = null;
      if (seq !== searchSeq) { resolve(); return; }
      // 可能是会话失效导致 401，回到登录面板
      const state = await loadAuth();
      if (seq !== searchSeq) { resolve(); return; }
      if (state.db_enabled && !state.logged_in) {
        $("status").innerHTML = `<span class="warn">登录状态已失效，请重新登录</span>`;
      } else {
        $("status").innerHTML = `<span class="warn">搜索失败，请重试</span>`;
      }
      resolve();
    });
  });
}

// fetchPage 翻页走普通接口：服务端缓存了完整结果池，翻页是秒回。
async function fetchPage(page, seq) {
  try {
    const resp = await fetch("/api/search?" + pageParams(page).toString());
    if (seq !== searchSeq) return false;
    if (resp.status === 401) {
      await loadAuth();
      $("status").innerHTML = `<span class="warn">请先登录</span>`;
      return false;
    }
    const data = await resp.json();
    if (seq !== searchSeq) return false;
    if (data.error) throw new Error(data.error);
    lastData = data;
    renderStatus(data);
    renderResults(data.results || []);
    renderPager(data);
    return true;
  } catch (e) {
    if (seq !== searchSeq) return false;
    $("status").innerHTML = `<span class="warn">翻页失败：${escapeHtml(e.message || String(e))}</span>`;
    return false;
  }
}

function closeStream() {
  if (stream) { stream.close(); stream = null; }
}

// resetLive 清空实时结果区。
function resetLive() {
  liveResults = [];
  $("results").innerHTML = "";
}

// pushLive 追加一条实时结果并按分数重排，只显示当前页那么多条。
function pushLive(r) {
  liveResults.push({ data: r, node: buildCard(r) });
  $("results").appendChild(liveResults[liveResults.length - 1].node);
  relayoutLive();
  renderProgress();
}

// relayoutLive 用 CSS order 重排，不重建 DOM。
function relayoutLive() {
  const perPage = parseInt($("perPage").value || "20", 10);
  const order = liveResults.map((item, i) => i).sort((a, b) => {
    const da = liveResults[a].data, db = liveResults[b].data;
    if (db.score !== da.score) return db.score - da.score;
    return (db.relevance || 0) - (da.relevance || 0);
  });
  order.forEach((idx, pos) => {
    liveResults[idx].node.style.order = pos;
    liveResults[idx].node.style.display = pos < perPage ? "" : "none";
  });
}

// renderProgress 显示各引擎的完成情况。
function renderProgress() {
  const names = Object.keys(engineProgress);
  if (!names.length) return;
  const parts = names.map((n) => {
    const d = engineProgress[n];
    return d.error ? `${n} 失败` : `${n} ${d.count}`;
  });
  $("status").innerHTML =
    `<span><span class="spinner"></span> 搜索中… 已收到 ${liveResults.length} 条</span>` +
    `<span>${parts.join(" · ")}</span>`;
}

function renderStatus(data) {
  const s = $("status");
  const bits = [];
  bits.push(`<span>${data.total != null ? data.total : data.count} 条结果</span>`);
  if (data.dropped) bits.push(`<span>过滤 ${data.dropped} 条</span>`);
  bits.push(`<span>${(data.elapsed_ms / 1000).toFixed(1)}s</span>`);
  const per = Object.entries(data.per_engine || {}).map(([k, v]) => `${k} ${v}`).join(" · ");
  if (per) bits.push(`<span>${per}</span>`);
  if (!data.probe_available && data.probe_reason) bits.push(`<span class="warn">${data.probe_reason}</span>`);
  if (data.failures && data.failures.length) {
    bits.push(`<span class="warn">${data.failures.map((f) => f.engine).join(" ")} 失败</span>`);
  }
  s.innerHTML = bits.join("");
}

/* ---------- 结果卡片 ---------- */
function buildCard(r) {
  const v = VERDICT[r.verdict] || VERDICT.unknown;
  const parts = r.parts || {};
  const bar = ["relevance", "life", "swarm", "freshness"]
    .map((k) => `<i class="b-${k === "relevance" ? "rel" : k === "life" ? "life" : k === "swarm" ? "swarm" : "fresh"}" style="width:${(parts[k] || 0) * 100}%"></i>`)
    .join("");

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="rank"></div>
    <div class="main">
      <div class="title"></div>
      <div class="meta">
        <span>大小 <b>${r.size}</b></span>
        <span>可信对等端 <b>${r.peers}</b></span>
        <span>宣称做种 <b>${r.seeders < 0 ? "未知" : r.seeders}</b></span>
        <span>相关度 <b>${(r.relevance * 100).toFixed(0)}%</b></span>
        ${r.publish_date ? `<span>${r.publish_date}</span>` : ""}
        ${(r.sources || []).map((s) => `<span class="src">${escapeHtml(s)}</span>`).join("")}
      </div>
    </div>
    <div class="side">
      <span class="badge ${v.cls}">${v.text}</span>
      <div class="bar" title="相关度 / 存活证据 / 群体规模 / 新鲜度">${bar}</div>
      <div class="rowbtns">
        <button class="mini star" data-act="fav" data-fav-hash="${r.info_hash}" type="button">☆ 收藏</button>
        <button class="mini" data-act="copy">复制磁力</button>
        <button class="mini" data-act="detail">详情</button>
      </div>
    </div>`;
  card.querySelector(".title").textContent = r.title;
  const favBtn = card.querySelector('[data-act="fav"]');
  if (favoriteHashes.has(r.info_hash)) {
    favBtn.textContent = "★ 已收藏";
    favBtn.classList.add("on");
  }
  favBtn.onclick = (e) => {
    e.stopPropagation();
    toggleFavorite(r);
  };
  card.querySelector('[data-act="copy"]').onclick = (e) => {
    e.stopPropagation();
    copyToClipboard(r.magnet);
  };
  card.querySelector('[data-act="detail"]').onclick = (e) => { e.stopPropagation(); openDetail(r); };
  card.onclick = () => openDetail(r);
  return card;
}

function renderResults(items) {
  const box = $("results");
  box.innerHTML = "";
  if (!items.length) {
    box.innerHTML = `<div class="empty"><div class="big">没有符合条件的结果</div>
      <div>试试放宽筛选条件，或点右上角"检测"查看引擎是否可达</div></div>`;
    return;
  }
  items.forEach((r, i) => {
    const card = buildCard(r);
    card.querySelector(".rank").textContent = i + 1;
    box.appendChild(card);
  });
}

function openDetail(r) {
  closeFavDrawer();
  currentDetail = r;
  $("dTitle").textContent = r.title;
  $("dMeta").innerHTML = `<span>大小 <b>${r.size}</b></span><span>对等端 <b>${r.peers}</b></span>
    <span>置信度 <b>${(r.confidence * 100).toFixed(0)}%</b></span><span>总分 <b>${r.score}</b></span>`;
  $("dMagnet").value = r.magnet || "";
  $("dCopy").onclick = () => copyToClipboard($("dMagnet").value);
  const starred = favoriteHashes.has(r.info_hash);
  $("dFav").textContent = starred ? "★ 已收藏" : "☆ 收藏";
  $("dFav").classList.toggle("on", starred);
  $("dFav").onclick = () => toggleFavorite(r);
  const parts = r.parts || {};
  $("dParts").innerHTML = Object.keys(PART_NAME).map((k) => `
    <div class="row"><span>${PART_NAME[k]}</span>
      <span class="track"><i style="width:${(parts[k] || 0) * 100}%;background:${PART_COLOR[k]}"></i></span>
      <span class="val">${(parts[k] || 0).toFixed(3)}</span></div>`).join("");

  const kv = [
    ["Info Hash", r.info_hash],
    ["存活判定", (VERDICT[r.verdict] || VERDICT.unknown).text],
    ["来源引擎", (r.sources || []).join(", ")],
    ["Tracker", (r.trackers || []).join("\n") || "-"],
  ];
  $("dKv").innerHTML = kv.map(([k, v]) => `<dt>${k}</dt><dd>${escapeHtml(String(v))}</dd>`).join("");
  $("dHint").textContent = r.detail_url ? `详情页：${r.detail_url}` : "";
  loadFiles(r.info_hash);
  $("drawer").classList.add("open");
  syncMask();
}

function closeDetail() {
  currentDetail = null;
  $("drawer").classList.remove("open");
  syncMask();
}

// syncMask 根据抽屉状态统一控制遮罩，避免关掉一个抽屉后另一个还开着却没有遮罩。
function syncMask() {
  const open = $("drawer").classList.contains("open") || $("favDrawer").classList.contains("open");
  $("mask").classList.toggle("open", open);
}

function renderPager(data) {
  const box = $("pager");
  const total = data.total || 0;
  const pages = data.total_pages || 1;
  const cur = data.page || 1;
  box.innerHTML = "";

  const mk = (label, target, opts = {}) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    if (opts.on) b.className = "on";
    if (opts.disabled) b.disabled = true;
    else b.onclick = () => search(target, true);
    return b;
  };

  box.appendChild(mk("« 首页", 1, { disabled: cur <= 1 }));
  box.appendChild(mk("‹ 上一页", cur - 1, { disabled: cur <= 1 }));

  const nums = [];
  for (let p = 1; p <= pages; p++) {
    if (p === 1 || p === pages || Math.abs(p - cur) <= 2) nums.push(p);
  }
  let last = 0;
  for (const p of nums) {
    if (last && p - last > 1) {
      const gap = document.createElement("button");
      gap.type = "button";
      gap.textContent = "…";
      gap.disabled = true;
      box.appendChild(gap);
    }
    box.appendChild(mk(String(p), p, { on: p === cur }));
    last = p;
  }

  box.appendChild(mk("下一页 ›", cur + 1, { disabled: cur >= pages }));
  box.appendChild(mk("末页 »", pages, { disabled: cur >= pages }));

  const info = document.createElement("span");
  info.className = "info";
  info.textContent = `共 ${total} 条 · 第 ${cur}/${pages} 页`;
  box.appendChild(info);
}

/* ---------- 设置：只保留代理；数据库与登录开关来自配置或数据库 ---------- */
async function loadSettings() {
  try {
    const s = await (await fetch("/api/settings")).json();
    $("proxy").value = s.proxy || "";
    $("proxyScope").value = s.proxy_scope === "all" ? "all" : "region";
  } catch (e) { /* 读不到就保持默认 */ }
}

async function saveSettings() {
  const body = {
    proxy: $("proxy").value.trim(),
    proxy_scope: $("proxyScope").value,
  };
  try {
    const resp = await fetch("/api/settings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      let data = {};
      try { data = await resp.json(); } catch (e) { /* 非 JSON 错误响应 */ }
      toast(data.error || "设置保存失败");
      return false;
    }
    return true;
  } catch (e) {
    toast("设置保存失败");
    return false;
  }
}

// applySettings 界面上点「应用」时保存代理设置。
async function applySettings() {
  const ok = await saveSettings();
  if (ok) toast($("proxy").value.trim() ? "已应用代理：" + $("proxy").value.trim() : "已关闭代理");
}

/* ---------- 登录与账号 ---------- */
async function loadAuth() {
  try {
    authState = await (await fetch("/api/auth")).json();
  } catch (e) {
    authState = {
      db_enabled: false,
      db_available: false,
      needs_setup: false,
      logged_in: false,
      require_login: false,
      allow_register: false,
    };
  }
  applyAuth();
  return authState;
}

// applyAuth 依据认证状态调整界面：账号入口、收藏入口与登录遮罩。
function applyAuth() {
  $("accountChip").style.display = authState.db_available ? "" : "none";
  $("favBtn").style.display = authState.db_enabled ? "" : "none";
  $("accountBtn").style.display = authState.logged_in ? "" : "none";
  $("logoutBtn").style.display = authState.logged_in ? "" : "none";
  // 数据库记录关闭时不要求也不支持登录，避免出现“登录成功但没有会话”的假入口
  $("loginBtn").style.display = authState.db_enabled && !authState.logged_in ? "" : "none";

  if (gateForced()) {
    showGate(authState.needs_setup ? "setup" : "login");
  } else {
    $("gate").classList.remove("open");
  }
}

// gateForced 表示登录遮罩是否必须显示：数据库启用登录要求，且尚未设置账号或未登录。
function gateForced() {
  return authState.db_enabled && authState.require_login && (authState.needs_setup || !authState.logged_in);
}

// showGate 显示登录/首次设置/注册/修改账号面板。
function showGate(mode) {
  gateMode = mode;
  const texts = {
    login:    { title: "登录", sub: "登录后可保存搜索历史与收藏，并管理账号。", submit: "登录", confirm: false },
    setup:    { title: "首次设置登录账号", sub: "服务已开启数据库。请先设置一个账号，之后可以用它登录并管理账号。", submit: "设置并登录", confirm: true },
    register: { title: "注册账号", sub: "注册并登录后即可保存搜索历史与收藏，账号信息会保存到数据库。", submit: "注册并登录", confirm: true },
    change:   { title: "修改账号密码", sub: "留空密码则只改用户名；修改后立即生效。", submit: "保存", confirm: true },
  };
  const t = texts[mode] || texts.login;
  $("gateTitle").textContent = t.title;
  $("gateSub").textContent = t.sub;
  $("gateSubmit").textContent = t.submit;
  $("gateConfirmWrap").style.display = t.confirm ? "" : "none";
  // 修改账号时密码可以留空表示保持原密码，因此动态取消 HTML 必填约束。
  $("gatePass").required = mode !== "change";
  $("gatePass").autocomplete = mode === "login" ? "current-password" : "new-password";
  $("gateErr").textContent = "";
  // 强制登录时不允许关闭；主动点开的登录/设置/注册面板可以取消。
  $("gateFoot").style.display = mode === "change" || !gateForced() ? "" : "none";
  $("gateRegisterWrap").style.display = mode === "login" && authState.allow_register ? "" : "none";
  $("gateLoginWrap").style.display = mode === "register" ? "" : "none";
  $("gateLogout").textContent = "取消";
  $("gate").classList.add("open");
  setTimeout(() => $("gateUser").focus(), 60);
}

// showLoginGate 在认证失效后重新显示登录面板；全新系统则显示首次设置。
// 数据库记录关闭时不要求登录，因此不显示无法完成登录的遮罩。
function showLoginGate() {
  if (!authState.db_enabled) return;
  showGate(authState.needs_setup ? "setup" : "login");
}

$("gateForm").onsubmit = async (e) => {
  e.preventDefault();
  const username = $("gateUser").value.trim();
  const password = $("gatePass").value;
  const password2 = $("gatePass2").value;
  if (!username) {
    $("gateErr").textContent = "请输入用户名";
    return;
  }
  if (gateMode === "change") {
    // 修改账号时密码留空表示保持原密码；只有输入了新密码才校验确认密码。
    if ((password || password2) && password !== password2) {
      $("gateErr").textContent = "两次输入的密码不一致";
      return;
    }
  } else if (gateMode !== "login") {
    if (!password) {
      $("gateErr").textContent = "请输入密码";
      return;
    }
    if (password !== password2) {
      $("gateErr").textContent = "两次输入的密码不一致";
      return;
    }
  }
  const url = gateMode === "login" ? "/api/login" : gateMode === "register" ? "/api/register" : "/api/account";
  $("gateSubmit").disabled = true;
  try {
    const resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "操作失败");
    $("gatePass").value = "";
    $("gatePass2").value = "";
    $("gate").classList.remove("open");
    await loadAuth();
    await refreshUserData();
    toast(gateMode === "login" ? "已登录" : gateMode === "register" ? "注册成功" : "账号已保存");
  } catch (err) {
    $("gateErr").textContent = err.message || String(err);
  } finally {
    $("gateSubmit").disabled = false;
  }
};

// 账号入口：修改用户名/密码
$("accountBtn").onclick = () => {
  $("gateUser").value = authState.username || "";
  $("gatePass").value = "";
  $("gatePass2").value = "";
  showGate("change");
};

// 未登录时的登录入口：没有账号则直接进入首次设置。
$("loginBtn").onclick = () => {
  $("gateUser").value = "";
  $("gatePass").value = "";
  $("gatePass2").value = "";
  showGate(authState.needs_setup ? "setup" : "login");
};

// 退出登录：清掉会话后重新读取认证状态。
$("logoutBtn").onclick = async () => {
  await fetch("/api/logout", { method: "POST" });
  await loadAuth();
  await refreshUserData();
  toast("已退出登录");
};

// 登录面板里的注册入口，以及注册面板返回登录。
$("gateRegister").onclick = (e) => {
  e.preventDefault();
  $("gatePass").value = "";
  $("gatePass2").value = "";
  $("gateErr").textContent = "";
  showGate("register");
};
$("gateLoginBack").onclick = (e) => {
  e.preventDefault();
  $("gateErr").textContent = "";
  showGate("login");
};

// 取消（仅修改账号时）/ 退出登录
$("gateLogout").onclick = async (e) => {
  e.preventDefault();
  if (gateMode === "change" || !gateForced()) {
    $("gate").classList.remove("open");
    return;
  }
  await fetch("/api/logout", { method: "POST" });
  await loadAuth();
  await refreshUserData();
  toast("已退出登录");
};

// 手机端折叠筛选面板，摘要里显示当前选中几个引擎
function updateFiltersSummary() {
  const total = engines.length;
  const on = activeEngines.size;
  $("filtersSummary").textContent = on === total ? "筛选（全部引擎）" : `筛选（${on}/${total} 引擎）`;

$("filtersToggle").onclick = () => {
  const f = document.querySelector(".filters");
  f.classList.toggle("open");
  $("filtersToggle").lastElementChild.textContent = f.classList.contains("open") ? "▴" : "▾";
  updateFiltersSummary();
};

// 关闭详情（手机上抽屉铺满整屏，点遮罩点不到，必须有关闭按钮）
$("dClose").onclick = closeDetail;

/* ---------- 筛选提示：固定定位并自动避开视口边缘 ---------- */
const tipBubble = $("tipBubble");
let tipTarget = null;

function showTip(el) {
  const text = el.dataset.tip;
  if (!text) return;
  tipTarget = el;
  tipBubble.textContent = text;
  tipBubble.hidden = false;
  tipBubble.classList.remove("open");

  // 先量出实际尺寸，再把气泡收敛到视口内，避免手机上溢出屏幕
  const margin = 12;
  const gap = 8;
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  const rect = el.getBoundingClientRect();
  const bw = Math.min(tipBubble.offsetWidth, vw - margin * 2);
  const bh = tipBubble.offsetHeight;
  const left = Math.min(Math.max(margin, rect.left), Math.max(margin, vw - bw - margin));
  let top = rect.bottom + gap;
  if (top + bh > vh - margin) {
    const above = rect.top - gap - bh;
    top = above >= margin ? above : Math.max(margin, vh - bh - margin);
  }
  tipBubble.style.left = `${Math.round(left)}px`;
  tipBubble.style.top = `${Math.round(top)}px`;
  tipBubble.classList.add("open");
}

function hideTip() {
  tipBubble.classList.remove("open");
  tipBubble.hidden = true;
  tipTarget = null;
}

function toggleTip(el) {
  if (tipTarget === el && tipBubble.classList.contains("open")) hideTip();
  else showTip(el);
}

const canHover = window.matchMedia("(hover: hover)");

document.querySelectorAll(".tip").forEach((el) => {
  el.tabIndex = 0;
  el.addEventListener("pointerenter", (e) => {
    if (e.pointerType !== "touch") showTip(el);
  });
  el.addEventListener("pointerleave", (e) => {
    if (e.pointerType !== "touch") hideTip();
  });
  // 触屏点按时浏览器会先聚焦再触发 click，这里不能让聚焦把 click 的切换抵消掉
  el.addEventListener("focus", () => { if (canHover.matches) showTip(el); });
  el.addEventListener("blur", () => { if (canHover.matches) hideTip(); });
  el.addEventListener("click", (e) => {
    // 触屏没有 hover，点一下展开、再点收起；桌面端交给悬停
    if (canHover.matches) return;
    e.preventDefault();
    toggleTip(el);
  });
  el.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    toggleTip(el);
  });
});

document.addEventListener("click", (e) => {
  const target = e.target instanceof Element ? e.target : null;
  if (!target || !target.closest(".tip")) hideTip();
});
document.addEventListener("scroll", hideTip, true);
window.addEventListener("resize", hideTip);
window.addEventListener("orientationchange", hideTip);

$("go").onclick = () => search(1);
$("perPage").onchange = () => {
  savePrefs();
  if (searchState) {
    searchState.params.set("per_page", $("perPage").value || "20");
    search(1, true);
  } else {
    search(1);
  }
};
$("applyProxy").onclick = applySettings;
$("healthBtn").onclick = checkHealth;
$("mask").onclick = () => { closeDetail(); closeFavDrawer(); };
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(1); });

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeDetail(); closeFavDrawer(); hideTip(); return; }
  // 正在输入框里打字时不抢焦点，否则代理地址之类的没法直接敲
  const el = document.activeElement;
  const tag = el ? el.tagName : "";
  const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (el && el.isContentEditable);
  if (e.key === "/" && !typing) {
    e.preventDefault();
    $("q").focus();
  }
});

(async () => {
  await loadAuth();
  await loadEngines();
  await loadSettings();
  await refreshUserData();
})();

name: release

# 打 tag 时构建各平台二进制并附到 Release 上。
# 本地跨平台构建见 scripts/build.sh。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""

    # 每个 run 步骤是独立 shell，跨步骤共享的变量必须放在 job 级 env
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
      BIN: msearch-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建
        run: go build -trimpath -ldflags "-s -w" -o "$BIN" ./cmd/msearch

      # 交叉编译产物无法在 runner 上直接执行，改用 go version -m 校验目标平台
      - name: 自检
        run: |
          file "$BIN"
          info="$(go version -m "$BIN")"
          printf '%s\n' "$info"
          grep -q "GOOS=${GOOS}" <<<"$info"
          grep -q "GOARCH=${GOARCH}" <<<"$info"

      - uses: actions/upload-artifact@v4
        with:
          name: msearch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BIN }}
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

name: release

# 打 tag 时构建各平台二进制并附到 Release 上。
# 本地跨平台构建见 scripts/build.sh。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="msearch-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then name="msearch-${GOOS}-${GOARCH}.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "$name" ./cmd/msearch

      - name: 自检
        run: |
          if [ "$GOOS" = "windows" ]; then
            file "$name"
          else
            "$name" version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: msearch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ format('msearch-{0}-{1}{2}', matrix.goos, matrix.goarch, matrix.ext) }}
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
